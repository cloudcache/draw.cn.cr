<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>网络拓扑编辑器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0d1117;color:#e2e8f0;font-size:13px}
#app{display:flex;width:100%;height:100%}

/* Sidebar */
#sidebar{width:220px;background:#161b22;border-right:1px solid #21262d;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#sidebar h2{padding:12px 12px 6px;font-size:12px;color:#8b949e;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:4px 8px 8px}
.tool-btn{background:#0d1117;border:1px solid #21262d;color:#8b949e;padding:7px 2px;cursor:pointer;border-radius:5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;transition:all .1s}
.tool-btn:hover{background:#1c2128;color:#e2e8f0}
.tool-btn.active{background:#1f6feb22;border-color:#1f6feb;color:#58a6ff}
.tool-btn img{width:15px;height:15px;opacity:.8}
.tool-btn.active img{opacity:1;filter:brightness(0) saturate(100%) invert(56%) sepia(69%) saturate(476%) hue-rotate(183deg) brightness(101%) contrast(96%)}

.palette{flex:1;overflow-y:auto;padding:0 6px 8px}
.palette h3{font-size:10px;color:#8b949e;padding:8px 4px 3px;text-transform:uppercase;letter-spacing:.5px}
.palette-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.palette-item{background:#0d1117;border:1px solid #21262d;border-radius:5px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:grab;font-size:9px;color:#8b949e;transition:all .1s;text-align:center;line-height:1.1;user-select:none}
.palette-item:hover{border-color:#1f6feb;background:#1c2128;color:#e2e8f0}
.palette-item img{width:16px;height:16px}

/* Canvas */
#canvas-wrap{flex:1;position:relative;background:#0d1117;background-image:radial-gradient(circle,#1e253044 1px,transparent 1px);background-size:24px 24px;overflow:hidden}
#canvas{width:100%;height:100%;display:block;cursor:default;touch-action:none}
#canvas.tool-pan{cursor:grab}
#canvas.panning{cursor:grabbing!important}
#canvas.tool-connect{cursor:crosshair}
#canvas.tool-zone{cursor:crosshair}

/* Topbar */
#topbar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;pointer-events:none;z-index:5;flex-wrap:wrap}
#topbar .grp{display:flex;gap:4px;background:rgba(22,27,34,.92);border:1px solid #21262d;padding:5px;border-radius:7px;pointer-events:auto;backdrop-filter:blur(8px)}
#topbar button{background:#0d1117;border:1px solid #21262d;color:#e2e8f0;padding:5px 9px;cursor:pointer;border-radius:4px;font-size:11px;display:inline-flex;align-items:center;gap:4px;transition:all .1s}
#topbar button:hover{background:#1c2128;border-color:#388bfd}
#topbar button:disabled{opacity:.35;cursor:not-allowed}
#topbar button img{width:13px;height:13px}
#hint{margin-left:auto;color:#8b949e;font-size:11px;padding:7px 10px;pointer-events:none;background:rgba(22,27,34,.7);border-radius:6px;backdrop-filter:blur(4px)}

/* Props */
#props{width:260px;background:#161b22;border-left:1px solid #21262d;padding:12px;overflow-y:auto;flex-shrink:0}
#props h2{font-size:12px;margin-bottom:8px;color:#e2e8f0;font-weight:600}
.empty-msg{color:#8b949e;font-size:12px;text-align:center;padding:24px 0;line-height:1.6}
.prop-group{margin-bottom:4px}
.prop-label{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.4px;margin:10px 0 4px;display:block}
.prop-input{width:100%;background:#0d1117;border:1px solid #21262d;color:#e2e8f0;padding:5px 8px;border-radius:4px;font-size:12px;font-family:inherit;transition:border-color .1s}
.prop-input:focus{outline:none;border-color:#1f6feb}
.prop-color{height:32px;padding:2px;cursor:pointer}
.color-row{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.swatch{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all .1s;flex-shrink:0}
.swatch.on{border-color:#fff}
.swatch:hover{transform:scale(1.15)}
.prop-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.prop-row label{font-size:11px;color:#e2e8f0;flex:1}
.prop-row .prop-input{width:70px}
.seg{display:flex;gap:2px;margin-top:2px}
.seg button{flex:1;background:#0d1117;border:1px solid #21262d;color:#8b949e;padding:5px 2px;border-radius:4px;cursor:pointer;font-size:10px;transition:all .1s;text-align:center}
.seg button:hover{background:#1c2128;color:#e2e8f0}
.seg button.on{background:#1f6feb22;border-color:#1f6feb;color:#58a6ff}
.prop-btn{width:100%;background:#21262d;border:1px solid #30363d;color:#e2e8f0;padding:7px;border-radius:4px;cursor:pointer;font-size:11px;margin-top:6px;transition:all .1s}
.prop-btn:hover{background:#30363d}
.prop-btn.danger{background:#b91c1c22;border-color:#ef4444;color:#ef4444;margin-top:12px}
.prop-btn.danger:hover{background:#b91c1c44}

/* SVG elements */
.node-sel{display:none;fill:none;stroke:#1f6feb;stroke-width:2;stroke-dasharray:3,2}
.node.sel .node-sel{display:block}
.edge.sel path.vis{filter:drop-shadow(0 0 4px #1f6feb)}
.zone.sel .zrect{stroke-width:2.5!important}
/* context menu */
#ctx-menu{position:fixed;z-index:9999;background:#161b22;border:1px solid #30363d;border-radius:7px;padding:4px 0;min-width:140px;box-shadow:0 8px 24px #0009;display:none;user-select:none}
#ctx-menu.show{display:block}
.ctx-item{padding:6px 14px;font-size:12px;color:#e2e8f0;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ctx-item:hover{background:#1f2937;color:#fff}
.ctx-item.danger{color:#ef4444}
.ctx-item.danger:hover{background:#2d1515}
.ctx-sep{height:1px;background:#21262d;margin:3px 0}
.ctx-item .ctx-icon{font-size:13px;width:16px;text-align:center;opacity:.8}
</style>
</head>
<body>
<div id="ctx-menu"></div>
<div id="app">
  <div id="sidebar">
    <h2>工具</h2>
    <div class="tools" id="tools"></div>
    <div class="palette" id="palette"></div>
  </div>
  <div id="canvas-wrap">
    <div id="topbar">
      <div class="grp">
        <button id="btn-undo" disabled title="撤销 Ctrl+Z"></button>
        <button id="btn-redo" disabled title="重做 Ctrl+Shift+Z"></button>
      </div>
      <div class="grp">
        <button id="btn-zi" title="放大"></button>
        <button id="btn-zo" title="缩小"></button>
        <button id="btn-fit">适配</button>
        <button id="btn-100">100%</button>
      </div>
      <div class="grp">
        <button id="btn-new" title="新建画布">新建</button>
        <button id="btn-save" title="保存到本地 Ctrl+S">保存</button>
      </div>
      <div class="grp">
        <button id="btn-grid" title="网格对齐 G" style="min-width:56px">网格:关</button>
        <input id="inp-grid" type="number" value="20" min="5" max="100" step="5" title="网格大小(px)"
          style="width:44px;background:#0d1117;border:1px solid #21262d;color:#e2e8f0;padding:4px 5px;border-radius:4px;font-size:11px;text-align:center">
      </div>
      <div class="grp">
        <button id="btn-expjson">JSON</button>
        <button id="btn-exppng">PNG</button><select id="sel-pngscale" title="导出倍率" style="background:#161b22;color:#e2e8f0;border:1px solid #30363d;border-radius:4px;font-size:11px;padding:1px 2px;cursor:pointer"><option value="2">2x</option><option value="3">3x</option><option value="4" selected>4x</option></select>
        <button id="btn-expsvg">SVG</button>
        <button id="btn-imp">导入</button>
        <input type="file" id="file-imp" accept=".json" style="display:none">
      </div>
      <div id="hint">就绪 · V选择 E连线 Z区域 空格平移</div>
    </div>
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs id="defs"></defs>
      <g id="world">
        <g id="layer-zones"></g>
        <g id="layer-edges"></g>
        <g id="layer-nodes"></g>
        <g id="layer-anchors"></g>
      </g>
      <g id="layer-ui"></g>
    </svg>
  </div>
  <div id="props"><div class="empty-msg">未选择元素<br><small>点击节点/连线/区域编辑属性</small></div></div>
</div>

/* anchor key → [dx,dy] unit vector outward from node center */
const ANCHOR_DIRS = {
  n:[0,-1], ne:[.707,-.707], e:[1,0], se:[.707,.707],
  s:[0,1],  sw:[-.707,.707], w:[-1,0], nw:[-.707,-.707],
  c:[0,0]
};
function anchorPos(node,key){
  const r=node.size||27, [dx,dy]=ANCHOR_DIRS[key]||[0,0];
  return {x:node.x+dx*r, y:node.y+dy*r};
}
function nearestAnchor(node,wx,wy){
  let best='c',bestD=Infinity;
  for(const [key,[dx,dy]] of Object.entries(ANCHOR_DIRS)){
    const r=node.size||27;
    const d=Math.hypot(node.x+dx*r-wx, node.y+dy*r-wy);
    if(d<bestD){bestD=d;best=key;}
  }
  return best;
}

/* ============================================================
   LAYER ORDER — nodes rendered in S.nodes array order (last = top)
   ============================================================ */
function _reorderArr(arr,id,fn){
  const i=arr.findIndex(x=>x.id===id); if(i<0) return;
  const item=arr.splice(i,1)[0];
  fn(arr,item);
  arr.splice(arr.indexOf(item)<0?arr.length:arr.indexOf(item),0,item);
}
function layerOp(type,id,op){
  const arr=type==='node'?S.nodes:type==='edge'?S.edges:S.zones;
  const i=arr.findIndex(x=>x.id===id); if(i<0) return;
  const item=arr.splice(i,1)[0];
  if(op==='front') arr.push(item);
  else if(op==='back') arr.unshift(item);
  else if(op==='forward'){ arr.splice(Math.min(i+1,arr.length),0,item); }
  else if(op==='backward'){ arr.splice(Math.max(i-1,0),0,item); }
  // sync DOM order to array order
  const layId=type==='node'?'layer-nodes':type==='edge'?'layer-edges':'layer-zones';
  const pfx=type==='node'?'ng-':type==='edge'?'eg-':'zg-';
  const lay=document.getElementById(layId);
  arr.forEach(x=>{ const g=document.getElementById(pfx+x.id); if(g) lay.appendChild(g); });
  snap();
}

const LS_KEY='topology_v1';

function lsLoad(){
  try{

    const d=JSON.parse(raw); S.nodes=d.nodes||[]; S.edges=d.edges||[]; S.zones=d.zones||[];
    return true;
  }catch(_){ return false; }
}
function toast(msg,ms=2000){
  let t=document.getElementById('_toast');
  if(!t){ t=document.createElement('div'); t.id='_toast';
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f6feb;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;z-index:9999;pointer-events:none;transition:opacity .3s';
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity=1;
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.style.opacity=0,ms);
}

function snap(){
  undoStack.push(JSON.stringify({nodes:S.nodes,edges:S.edges,zones:S.zones}));
  redoStack.length=0;
  if(undoStack.length>60) undoStack.shift();
  updUndoBtns();
  lsSave(); // auto-save on every change
}
function applySnap(str){
  const d=JSON.parse(str); S.nodes=d.nodes; S.edges=d.edges; S.zones=d.zones;
  S.sel=null; S.multiSel.clear();
  renderAll(); renderProps(); updUndoBtns();
}
function undo(){ if(!undoStack.length)return; redoStack.push(JSON.stringify({nodes:S.nodes,edges:S.edges,zones:S.zones})); applySnap(undoStack.pop()); }
function redo(){ if(!redoStack.length)return; undoStack.push(JSON.stringify({nodes:S.nodes,edges:S.edges,zones:S.zones})); applySnap(redoStack.pop()); }
function updUndoBtns(){
  document.getElementById('btn-undo').disabled=!undoStack.length;
  document.getElementById('btn-redo').disabled=!redoStack.length;
}

/* ============================================================
   SVG HELPERS
   ============================================================ */
const NS='http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const e=document.createElementNS(NS,tag);
  if(attrs) for(const k in attrs){ if(attrs[k]!=null) e.setAttribute(k,attrs[k]); }
  return e;
}

/* ============================================================
   MARKERS — filled/open arrows, circles, diamonds per color
   ============================================================ */
const _markers = new Set();
function markerId(type, color){ return `mk-${type}-${color.replace('#','')}`.toLowerCase(); }
function ensureMarker(type, color){
  const id = markerId(type, color);
  if(_markers.has(id)) return id;
  _markers.add(id);
  const defs = document.getElementById('defs');
  let m, inner;
  if(type==='arrow'){
    m = svgEl('marker',{id,markerWidth:10,markerHeight:7,refX:9,refY:3.5,orient:'auto',markerUnits:'strokeWidth'});
    inner = svgEl('polygon',{points:'0 0,10 3.5,0 7',fill:color});
  } else if(type==='open'){
    m = svgEl('marker',{id,markerWidth:10,markerHeight:7,refX:8,refY:3.5,orient:'auto',markerUnits:'strokeWidth'});
    inner = svgEl('polyline',{points:'0 0,8 3.5,0 7',fill:'none',stroke:color,'stroke-width':'1.5'});
  } else if(type==='circle'){
    m = svgEl('marker',{id,markerWidth:8,markerHeight:8,refX:4,refY:4,orient:'auto',markerUnits:'strokeWidth'});
    inner = svgEl('circle',{cx:4,cy:4,r:3,fill:color});
  } else if(type==='diamond'){
    m = svgEl('marker',{id,markerWidth:12,markerHeight:8,refX:10,refY:4,orient:'auto',markerUnits:'strokeWidth'});
    inner = svgEl('polygon',{points:'0 4,5 0,10 4,5 8',fill:color});
  } else { return ''; }
  m.appendChild(inner);
  defs.appendChild(m);
  return id;
}
function markerUrl(type, color){
  if(!type || type==='none') return null;
  return 'url(#' + ensureMarker(type,color) + ')';
}

/* ============================================================
   GEOMETRY
   ============================================================ */
function edgePath(x1,y1,d1x,d1y,x2,y2,d2x,d2y,lineType){
  if(lineType==='straight') return `M${x1},${y1} L${x2},${y2}`;
  if(lineType==='ortho'){
    // use anchor directions to pick elbow style
    const horiz1=Math.abs(d1x)>Math.abs(d1y);
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    if(horiz1) return `M${x1},${y1} L${mx},${y1} L${mx},${y2} L${x2},${y2}`;
    return `M${x1},${y1} L${x1},${my} L${x2},${my} L${x2},${y2}`;
  }
  // directional bezier — control points follow anchor outward direction
  const dist=Math.hypot(x2-x1,y2-y1);
  // clamp tension: smaller when nodes are close, cap at 180 to avoid huge loops
  const t=Math.min(Math.max(30,dist*0.42),180);
  // cx1 departs from src in anchor direction; cx2 approaches dst from anchor direction
  // (bezier tangent at P3 goes P2→P3, so P2 must be "behind" P3 in arrival direction)
  const auto1=(d1x===0&&d1y===0), auto2=(d2x===0&&d2y===0);
  const adx=x2-x1, ady=y2-y1;
  const cx1 = auto1 ? x1+adx*0.45 : x1+d1x*t;
  const cy1 = auto1 ? y1+ady*0.1  : y1+d1y*t;
  const cx2 = auto2 ? x2-adx*0.45 : x2+d2x*t;
  const cy2 = auto2 ? y2-ady*0.1  : y2+d2y*t;
  return `M${x1},${y1} C${cx1},${cy1} ${cx2},${cy2} ${x2},${y2}`;
}
function edgePoints(e){
  const a=nodeById(e.src), b=nodeById(e.dst);
  if(!a||!b) return null;
  const sk=e.srcAnchor||'c', dk=e.dstAnchor||'c';
  const p1=anchorPos(a,sk), p2=anchorPos(b,dk);
  const [d1x,d1y]=ANCHOR_DIRS[sk]||[0,0];
  const [d2x,d2y]=ANCHOR_DIRS[dk]||[0,0];
  return {x1:p1.x,y1:p1.y,d1x,d1y,x2:p2.x,y2:p2.y,d2x,d2y};
}
function screenToWorld(cx,cy){
  const r=document.getElementById('canvas').getBoundingClientRect();
  return {x:(cx-r.left-view.x)/view.s, y:(cy-r.top-view.y)/view.s};
}
function setView(x,y,s){
  view.x=x; view.y=y; view.s=s;
  document.getElementById('world').setAttribute('transform',`translate(${x},${y}) scale(${s})`);
}

/* ============================================================
   ANCHOR OVERLAY
   ============================================================ */
let _anchorHoverNode=null;
function showAnchors(nodeId, highlightKey){
  const n=nodeById(nodeId); if(!n) return;
  if(_anchorHoverNode===nodeId && !highlightKey) return; // already shown
  _anchorHoverNode=nodeId;
  hideAnchors(false);
  const lay=document.getElementById('layer-anchors');
  const g=svgEl('g',{id:'_anch'});
  Object.entries(ANCHOR_DIRS).forEach(([key,[dx,dy]])=>{
    const r=n.size||27;
    const px=n.x+dx*r, py=n.y+dy*r;
    const isHL=key===highlightKey;
    const dot=svgEl('circle',{cx:px,cy:py,r:key==='c'?3.5:4.5,
      fill:isHL?'#22c55e':'#1f6feb',stroke:'#fff','stroke-width':1.2,
      cursor:'crosshair',opacity:.92,'data-akey':key,'data-anid':nodeId,
      'pointer-events':'all'});
    dot.addEventListener('mousedown',ev=>{ ev.stopPropagation(); onNodeDown(ev,nodeId); });
    g.appendChild(dot);
  });
  lay.appendChild(g);
}
function hideAnchors(clearNode=true){
  document.getElementById('_anch')?.remove();
  if(clearNode) _anchorHoverNode=null;
}

/* canvas hover → show anchors in connect mode */
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('canvas').addEventListener('mousemove',ev=>{
    if(S.tool!=='connect') return;
    const wp=screenToWorld(ev.clientX,ev.clientY);
    const hov=S.nodes.find(n=>Math.hypot(n.x-wp.x,n.y-wp.y)<=(n.size||27)+8);
    if(hov) showAnchors(hov.id);
    else hideAnchors();
  },{passive:true});
});

function initGrid(){

  if(!pat){
    pat=svgEl('pattern',{id:'_gpat',width:gs,height:gs,patternUnits:'userSpaceOnUse'});
    pat.appendChild(svgEl('line',{x1:gs,y1:0,x2:gs,y2:gs,stroke:'#334155','stroke-width':1}));
    pat.appendChild(svgEl('line',{x1:0,y1:gs,x2:gs,y2:gs,stroke:'#334155','stroke-width':1}));
    document.getElementById('defs').appendChild(pat);
    const bg=svgEl('rect',{id:'_gbg',x:-50000,y:-50000,width:100000,height:100000,
      fill:'url(#_gpat)','pointer-events':'none',display:'none'});
    document.getElementById('world').insertBefore(bg,document.getElementById('world').firstChild);
  }
}
function updateGridSize(){
  const gs=S.gridSize;
  const pat=document.getElementById('_gpat'); if(!pat) return;
  pat.setAttribute('width',gs); pat.setAttribute('height',gs);
  pat.querySelector('line:nth-child(1)')?.setAttribute('x1',gs);
  pat.querySelector('line:nth-child(1)')?.setAttribute('x2',gs);
  pat.querySelector('line:nth-child(1)')?.setAttribute('y2',gs);
  pat.querySelector('line:nth-child(2)')?.setAttribute('y1',gs);
  pat.querySelector('line:nth-child(2)')?.setAttribute('x2',gs);
  pat.querySelector('line:nth-child(2)')?.setAttribute('y2',gs);
}
function toggleGrid(){
  S.gridSnap=!S.gridSnap;
  const btn=document.getElementById('btn-grid');
  if(btn) btn.textContent='网格:'+(S.gridSnap?'开':'关');
  if(btn) btn.style.color=S.gridSnap?'#22c55e':'';

}

function renderEdge(e){
  let g=document.getElementById('eg-'+e.id);
  if(!g){
    g=svgEl('g',{id:'eg-'+e.id,class:'edge',cursor:'pointer'});
    g.addEventListener('mousedown',ev=>onEdgeDown(ev,e.id));
    g.addEventListener('contextmenu',ev=>{ ev.preventDefault(); ev.stopPropagation(); select('edge',e.id); showCtxMenu(ev.clientX,ev.clientY,ctxItemsForEdge(e.id)); });
    document.getElementById('layer-edges').appendChild(g);
  }
  const pts=edgePoints(e);
  if(!pts){ g.innerHTML=''; return; }
  const sel=S.sel&&S.sel.type==='edge'&&S.sel.id===e.id;
  g.innerHTML='';
  const d=edgePath(pts.x1,pts.y1,pts.d1x,pts.d1y,pts.x2,pts.y2,pts.d2x,pts.d2y,e.lineType);
  const da=DASH[e.dash]||'none';
  const ms=markerUrl(e.startArrow,e.color);
  const me=markerUrl(e.endArrow,e.color);
  // visible path
  const vis=svgEl('path',{d,fill:'none',stroke:e.color,'stroke-width':e.width,
    'stroke-dasharray':da,
    'marker-start':ms||'','marker-end':me||'',
    'stroke-linecap':'round',class:'vis',
    filter:sel?'url(#sel-glow)':''});
  if(sel) vis.setAttribute('filter','drop-shadow(0 0 4px #1f6feb)');
  g.appendChild(vis);
  // wide transparent hit area
  const hit=svgEl('path',{d,fill:'none',stroke:'transparent','stroke-width':Math.max(10,e.width+6),'pointer-events':'stroke'});
  g.appendChild(hit);
  // label
  if(e.label){
    const mx=(pts.x1+pts.x2)/2, my=(pts.y1+pts.y2)/2;
    const lbg=svgEl('rect',{x:mx-e.label.length*3.2-4,y:my-9,width:e.label.length*6.4+8,height:14,rx:3,fill:'#0d1117aa'});
    g.appendChild(lbg);
    const lt=svgEl('text',{x:mx,y:my+1,fill:'#e2e8f0','font-size':10,'text-anchor':'middle','dominant-baseline':'middle','pointer-events':'none'});
    lt.textContent=e.label;
    g.appendChild(lt);
  }
  // show anchor endpoint dots when edge is selected
  if(sel){
    [[pts.x1,pts.y1],[pts.x2,pts.y2]].forEach(([px,py])=>{
      g.appendChild(svgEl('circle',{cx:px,cy:py,r:4,fill:'#1f6feb',stroke:'#fff','stroke-width':1.2,'pointer-events':'none'}));
    });
  }
}

function renderNode(n){
  let g=document.getElementById('ng-'+n.id);
  if(!g){
    g=svgEl('g',{id:'ng-'+n.id,class:'node',cursor:'move'});
    g.addEventListener('mousedown',ev=>onNodeDown(ev,n.id));
    g.addEventListener('dblclick',ev=>startLabelEdit(ev,n.id));
    g.addEventListener('contextmenu',ev=>{
      ev.preventDefault(); ev.stopPropagation();
      if(S.multiSel.size>1&&S.multiSel.has(n.id)){
        showCtxMenu(ev.clientX,ev.clientY,ctxItemsForMulti());
      } else {
        select('node',n.id);
        showCtxMenu(ev.clientX,ev.clientY,ctxItemsForNode(n.id));
      }
    });
    document.getElementById('layer-nodes').appendChild(g);
  }
  const sel=S.sel&&S.sel.type==='node'&&S.sel.id===n.id;
  const inMulti=S.multiSel.has(n.id);
  const r=n.size||27;
  const isize=Math.round(r*0.72);
  const fontSize=Math.max(8,Math.round(r*0.36));
  const maxW=Math.max(6,Math.round(r*0.37));
  g.innerHTML='';
  g.setAttribute('transform',`translate(${n.x},${n.y})`);
  if(sel){
    g.appendChild(svgEl('circle',{cx:0,cy:0,r:r+5,fill:'none',stroke:'#1f6feb','stroke-width':2,'stroke-dasharray':'3 2',opacity:.8}));
  } else if(inMulti){
    g.appendChild(svgEl('circle',{cx:0,cy:0,r:r+5,fill:'none',stroke:'#22c55e','stroke-width':2,'stroke-dasharray':'3 2',opacity:.85}));
  }
  const rgb=hexRgb(n.color);
  g.appendChild(svgEl('circle',{cx:0,cy:0,r,fill:`rgba(${rgb.r},${rgb.g},${rgb.b},0.18)`,stroke:n.color,'stroke-width':(sel||inMulti)?2:1.5}));
  const img=svgEl('image',{href:iconSvg(n.icon,n.color,24),x:-isize/2,y:-isize/2-Math.round(r*0.14),width:isize,height:isize,'pointer-events':'none'});

function alignNodes(dir){
  const ids=[...S.multiSel]; if(!ids.length) return;
  const nodes=ids.map(nodeById).filter(Boolean); if(!nodes.length) return;
  const r=n=>n.size||27;
  snap();
  const upd=n=>{ renderNode(n); S.edges.filter(e=>e.src===n.id||e.dst===n.id).forEach(renderEdge); };
  // align by element edges, not centers — so elements don't overlap
  if(dir==='left'){
    const v=Math.min(...nodes.map(n=>n.x-r(n)));         // leftmost left-edge
    nodes.forEach(n=>{ n.x=v+r(n); upd(n); });
  } else if(dir==='right'){
    const v=Math.max(...nodes.map(n=>n.x+r(n)));         // rightmost right-edge
    nodes.forEach(n=>{ n.x=v-r(n); upd(n); });
  } else if(dir==='cx'){
    const minX=Math.min(...nodes.map(n=>n.x-r(n)));
    const maxX=Math.max(...nodes.map(n=>n.x+r(n)));
    const v=(minX+maxX)/2;
    nodes.forEach(n=>{ n.x=v; upd(n); });                // center X unchanged per-element size
  } else if(dir==='top'){
    const v=Math.min(...nodes.map(n=>n.y-r(n)));         // topmost top-edge
    nodes.forEach(n=>{ n.y=v+r(n); upd(n); });
  } else if(dir==='bottom'){
    const v=Math.max(...nodes.map(n=>n.y+r(n)));         // bottommost bottom-edge
    nodes.forEach(n=>{ n.y=v-r(n); upd(n); });
  } else if(dir==='cy'){
    const minY=Math.min(...nodes.map(n=>n.y-r(n)));
    const maxY=Math.max(...nodes.map(n=>n.y+r(n)));
    const v=(minY+maxY)/2;
    nodes.forEach(n=>{ n.y=v; upd(n); });
  }
}
function distributeNodes(axis){
  const ids=[...S.multiSel]; if(ids.length<3) return;
  const nodes=ids.map(nodeById).filter(Boolean); if(nodes.length<3) return;
  const r=n=>n.size||27;
  snap();
  const upd=n=>{ renderNode(n); S.edges.filter(e=>e.src===n.id||e.dst===n.id).forEach(renderEdge); };
  if(axis==='h'){
    nodes.sort((a,b)=>a.x-b.x);
    const totalSpan=nodes[nodes.length-1].x+r(nodes[nodes.length-1]) - (nodes[0].x-r(nodes[0]));
    const totalSize=nodes.reduce((s,n)=>s+r(n)*2,0);
    const gap=(totalSpan-totalSize)/(nodes.length-1);
    let cx=nodes[0].x; // first node stays
    nodes.forEach((n,i)=>{ if(i===0) return; cx+=r(nodes[i-1])+gap+r(n); n.x=cx; upd(n); });
  } else {
    nodes.sort((a,b)=>a.y-b.y);
    const totalSpan=nodes[nodes.length-1].y+r(nodes[nodes.length-1]) - (nodes[0].y-r(nodes[0]));
    const totalSize=nodes.reduce((s,n)=>s+r(n)*2,0);
    const gap=(totalSpan-totalSize)/(nodes.length-1);
    let cy=nodes[0].y;
    nodes.forEach((n,i)=>{ if(i===0) return; cy+=r(nodes[i-1])+gap+r(n); n.y=cy; upd(n); });
  }
}

/* ============================================================
   DRAG — RAF-based, selective update
   ============================================================ */
let drag=null, raf=null;

function onNodeDown(e,id){
  if(e.button!==0) return;
  e.stopPropagation();
  const n=nodeById(id);
  if(!n) return;

  // connect mode — drag from source anchor to target anchor
  if(S.tool==='connect'){
    const wp0=screenToWorld(e.clientX,e.clientY);
    const srcAnchor=nearestAnchor(n,wp0.x,wp0.y);
    const p0=anchorPos(n,srcAnchor);
    S._connSrc=id;

    const preview=svgEl('line',{id:'_conn_preview',
      stroke:'#1f6feb','stroke-width':1.5,'stroke-dasharray':'6 3',
      'pointer-events':'none',opacity:.85});
    preview.setAttribute('x1',p0.x); preview.setAttribute('y1',p0.y);
    preview.setAttribute('x2',p0.x); preview.setAttribute('y2',p0.y);
    document.getElementById('layer-anchors').appendChild(preview);
    showAnchors(id, srcAnchor);

    let _dstNode=null, _dstAnchor='c';
    const onMove=ev=>{
      const wp=screenToWorld(ev.clientX,ev.clientY);
      preview.setAttribute('x2',wp.x); preview.setAttribute('y2',wp.y);
      const hov=S.nodes.find(nd=>nd.id!==id&&Math.hypot(nd.x-wp.x,nd.y-wp.y)<=(nd.size||27)+8);
      if(hov){
        _dstNode=hov; _dstAnchor=nearestAnchor(hov,wp.x,wp.y);
        showAnchors(hov.id,_dstAnchor);
        const tp=anchorPos(hov,_dstAnchor);
        preview.setAttribute('x2',tp.x); preview.setAttribute('y2',tp.y);
      } else { _dstNode=null; hideAnchors(); }
    };

    window.addEventListener('mousemove',onMove,{passive:true});
    window.addEventListener('mouseup',ev=>{
      preview.remove();
      window.removeEventListener('mousemove',onMove);
      hideAnchors();
      S._connSrc=null;
      if(_dstNode){
        snap();
        S.edges.push({id:uid('e'),src:id,dst:_dstNode.id,color:'#475569',width:1.5,
          dash:'solid',lineType:'curve',startArrow:'none',endArrow:'arrow',label:'',
          srcAnchor,dstAnchor:_dstAnchor});
        renderAll();
        select('edge',S.edges[S.edges.length-1].id);
      }
    },{once:true});
    return;
  }

  // Shift+click → toggle multi-select
  if(e.shiftKey){
    if(S.multiSel.has(id)) S.multiSel.delete(id);
    else { S.multiSel.add(id); S.sel=null; }
    renderNode(n); renderProps();
    return;
  }

  // if clicking a node already in multi-select → drag all of them
  if(S.multiSel.size>0 && S.multiSel.has(id)){
    const wp=screenToWorld(e.clientX,e.clientY);
    const origPos=new Map([...S.multiSel].map(nid=>{ const nd=nodeById(nid); return [nid,{x:nd.x,y:nd.y}]; }));
    drag={ type:'multi', id, origPos, wx:wp.x, wy:wp.y };
    window.addEventListener('mousemove',onDragMove,{passive:true});
    window.addEventListener('mouseup',onDragEnd);
    return;
  }

  // normal single select
  S.multiSel.clear();
  select('node',id);
  const wp=screenToWorld(e.clientX,e.clientY);
  drag={ type:'node', id, ox:n.x, oy:n.y, wx:wp.x, wy:wp.y };
  window.addEventListener('mousemove',onDragMove,{passive:true});
  window.addEventListener('mouseup',onDragEnd);
}

function onDragMove(e){
  if(!drag) return;
  if(raf) return;
  raf=requestAnimationFrame(()=>{
    raf=null;
    if(!drag) return;
    const wp=screenToWorld(e.clientX,e.clientY);
    if(drag.type==='node'){
      const n=nodeById(drag.id); if(!n) return;
      n.x=snapToGrid(drag.ox+(wp.x-drag.wx));
      n.y=snapToGrid(drag.oy+(wp.y-drag.wy));
      const g=document.getElementById('ng-'+n.id);
      if(g) g.setAttribute('transform',`translate(${n.x},${n.y})`);
      S.edges.filter(ed=>ed.src===n.id||ed.dst===n.id).forEach(renderEdge);
    } else if(drag.type==='multi'){
      const ddx=wp.x-drag.wx, ddy=wp.y-drag.wy;
      drag.origPos.forEach((orig,nid)=>{
        const nd=nodeById(nid); if(!nd) return;
        nd.x=snapToGrid(orig.x+ddx); nd.y=snapToGrid(orig.y+ddy);
        const g=document.getElementById('ng-'+nid);
        if(g) g.setAttribute('transform',`translate(${nd.x},${nd.y})`);
        S.edges.filter(ed=>ed.src===nid||ed.dst===nid).forEach(renderEdge);
      });
    } else if(drag.type==='zone'){
      const z=zoneById(drag.id); if(!z) return;
      z.x=snapToGrid(drag.ox+(wp.x-drag.wx));
      z.y=snapToGrid(drag.oy+(wp.y-drag.wy));
      renderZone(z);
    } else if(drag.type==='zresize'){
      const z=zoneById(drag.id); if(!z) return;
      z.w=Math.max(60,drag.ow+(wp.x-drag.wx));
      z.h=Math.max(40,drag.oh+(wp.y-drag.wy));
      renderZone(z);
    } else if(drag.type==='pan'){
      const dx=e.clientX-drag.cx, dy=e.clientY-drag.cy;
      setView(drag.vx+dx,drag.vy+dy,view.s);
    }
  });
}

function onDragEnd(){
  if(drag && (drag.type==='node'||drag.type==='multi'||drag.type==='zone'||drag.type==='zresize')) snap();
  drag=null;
  window.removeEventListener('mousemove',onDragMove);
  window.removeEventListener('mouseup',onDragEnd);
}

function onZoneDown(e,id){
  if(e.button!==0) return;
  e.stopPropagation();
  select('zone',id);
  const z=zoneById(id);
  const wp=screenToWorld(e.clientX,e.clientY);
  drag={ type:'zone', id, ox:z.x, oy:z.y, wx:wp.x, wy:wp.y };
  window.addEventListener('mousemove',onDragMove,{passive:true});
  window.addEventListener('mouseup',onDragEnd);
}

function onZoneResize(e,id){
  if(e.button!==0) return;
  e.stopPropagation();
  const z=zoneById(id);
  const wp=screenToWorld(e.clientX,e.clientY);
  drag={ type:'zresize', id, ow:z.w, oh:z.h, wx:wp.x, wy:wp.y };
  window.addEventListener('mousemove',onDragMove,{passive:true});
  window.addEventListener('mouseup',onDragEnd);
}

function onEdgeDown(e,id){
  if(e.button!==0) return;
  e.stopPropagation();
  select('edge',id);
}

/* ============================================================
   CANVAS MOUSE — pan, place, zone draw
   ============================================================ */
let zoneDrawing=null;

document.getElementById('canvas').addEventListener('mousedown',e=>{
  if(e.button===1||S.tool==='pan'||(e.button===0&&e.altKey)){
    const cv=document.getElementById('canvas');
    cv.classList.add('panning');
    drag={ type:'pan', cx:e.clientX, cy:e.clientY, vx:view.x, vy:view.y };
    window.addEventListener('mousemove',onDragMove,{passive:true});
    window.addEventListener('mouseup',()=>{
      cv.classList.remove('panning');
      drag=null;
      window.removeEventListener('mousemove',onDragMove);
    },{once:true});
    return;
  }
  if(e.button!==0) return;
  const wp=screenToWorld(e.clientX,e.clientY);

  if(S.tool==='select'){
    // clear selection unless shift held
    if(!e.shiftKey){ S.sel=null; S.multiSel.clear(); }
    // box-select drag
    const wrap=document.getElementById('canvas-wrap');
    const wrapR=wrap.getBoundingClientRect();
    const sx0=e.clientX-wrapR.left, sy0=e.clientY-wrapR.top;
    const box=document.createElement('div');
    box.style.cssText='position:absolute;border:1.5px dashed #1f6feb;background:#1f6feb0d;pointer-events:none;z-index:50;left:'+sx0+'px;top:'+sy0+'px;width:0;height:0';
    wrap.appendChild(box);
    let moved=false;
    const onMove=ev=>{
      moved=true;
      const sx=ev.clientX-wrapR.left, sy=ev.clientY-wrapR.top;
      box.style.left=Math.min(sx0,sx)+'px'; box.style.top=Math.min(sy0,sy)+'px';
      box.style.width=Math.abs(sx-sx0)+'px'; box.style.height=Math.abs(sy-sy0)+'px';
    };
    const onUp=ev=>{
      box.remove();
      window.removeEventListener('mousemove',onMove);
      if(!moved){ renderAll(); renderProps(); return; }
      // world rect
      const wx1=(Math.min(e.clientX,ev.clientX)-wrapR.left-view.x)/view.s;
      const wy1=(Math.min(e.clientY,ev.clientY)-wrapR.top-view.y)/view.s;
      const wx2=(Math.max(e.clientX,ev.clientX)-wrapR.left-view.x)/view.s;
      const wy2=(Math.max(e.clientY,ev.clientY)-wrapR.top-view.y)/view.s;
      if(!e.shiftKey) S.multiSel.clear();
      S.nodes.forEach(n=>{ if(n.x>=wx1&&n.x<=wx2&&n.y>=wy1&&n.y<=wy2) S.multiSel.add(n.id); });
      S.sel=S.multiSel.size===1?{type:'node',id:[...S.multiSel][0]}:null;
      if(S.multiSel.size===1) S.multiSel.clear();
      renderAll(); renderProps();
    };
    window.addEventListener('mousemove',onMove,{passive:true});
    window.addEventListener('mouseup',onUp,{once:true});
    return;
  }

  if(S.tool==='zone'){
    const z={id:uid('z'),x:wp.x,y:wp.y,w:60,h:40,label:'新区域',color:'#3b82f6',op:.07};
    zoneDrawing={ id:z.id, sx:wp.x, sy:wp.y };
    snap(); S.zones.push(z); renderZone(z);
    const onMove=ev=>{
      const wp2=screenToWorld(ev.clientX,ev.clientY);
      z.x=Math.min(zoneDrawing.sx,wp2.x); z.y=Math.min(zoneDrawing.sy,wp2.y);
      z.w=Math.abs(wp2.x-zoneDrawing.sx)||60; z.h=Math.abs(wp2.y-zoneDrawing.sy)||40;
      renderZone(z);
    };
    const onUp=()=>{
      window.removeEventListener('mousemove',onMove);
      select('zone',z.id);
      zoneDrawing=null;
    };
    window.addEventListener('mousemove',onMove,{passive:true});
    window.addEventListener('mouseup',onUp,{once:true});
    return;
  }

  if(S.placeIcon){
    const {icon,label,color}=S.placeIcon;
    snap();
    const n={id:uid('n'),x:wp.x,y:wp.y,icon,label,color,big:false};
    S.nodes.push(n); renderNode(n); select('node',n.id);
    return;
  }
});

/* ============================================================
   SCROLL ZOOM
   ============================================================ */
document.getElementById('canvas').addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('canvas').addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey){
    // Ctrl+滚轮 → 缩放（以鼠标位置为中心）
    const factor=e.deltaY>0?0.85:1/0.85;
    const r=document.getElementById('canvas').getBoundingClientRect();
    const cx=e.clientX-r.left, cy=e.clientY-r.top;
    const ns=Math.max(0.1,Math.min(4,view.s*factor));
    setView(cx-(cx-view.x)*ns/view.s, cy-(cy-view.y)*ns/view.s, ns);
  } else {
    // 普通滚轮 → 平移；Shift+滚轮 → 横向平移
    const dx = e.shiftKey ? -e.deltaY : -e.deltaX;
    const dy = e.shiftKey ? 0 : -e.deltaY;
    setView(view.x+dx, view.y+dy, view.s);
  }
},{passive:false});

function startLabelEdit(e,id){
  e.stopPropagation();
  const n=nodeById(id); if(!n) return;
  document.getElementById('_lbl_edit')?.remove();
  const r=n.size||27;
  const cv=document.getElementById('canvas');
  const rect=cv.getBoundingClientRect();
  // world label center → screen coords
  const lwy=n.y+r+14;
  const sx=n.x*view.s+view.x+rect.left;
  const sy=lwy*view.s+view.y+rect.top;
  const fw=Math.max(120, n.label.length*10+20)*view.s;
  const fsize=Math.max(10,11*view.s);
  const inp=document.createElement('input');
  inp.id='_lbl_edit';
  inp.type='text'; inp.value=n.label;
  inp.style.cssText=`position:fixed;left:${sx-fw/2}px;top:${sy-10}px;width:${fw}px;height:22px;background:#0d1117;border:2px solid #1f6feb;color:#e2e8f0;font-size:${fsize}px;padding:1px 6px;border-radius:4px;z-index:9999;outline:none;font-family:inherit;text-align:center;box-shadow:0 2px 12px #0008`;
  document.body.appendChild(inp);
  inp.focus(); inp.select();
  let done=false;
  const commit=()=>{
    if(done) return; done=true;
    snap(); n.label=inp.value; inp.remove(); renderNode(n);
    if(S.sel?.type==='node'&&S.sel?.id===n.id) renderProps();
  };
  inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key==='Escape'){ ev.stopPropagation(); commit(); }});
  inp.addEventListener('blur',commit);
}

function setTool(t){
  S.tool=t; S._connSrc=null;
  // clear palette placement highlight when switching tool via buttons
  S.placeIcon=null;
  document.querySelectorAll('.palette-item').forEach(x=>x.style.outline='');
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));

  const hints={select:'V选择  E连线  Z区域  空格平移  双击改标签  Del删除',connect:'在源节点上按下，拖到目标节点后松开',zone:'拖拽绘制区域',pan:'拖拽平移，Ctrl+滚轮缩放'};
  setHint(hints[t]||'');

/* ============================================================
   ZOOM / FIT
   ============================================================ */
function zoomBy(f){
  const cv=document.getElementById('canvas');
  const cx=cv.clientWidth/2, cy=cv.clientHeight/2;
  const ns=Math.max(0.1,Math.min(4,view.s*f));
  setView(cx-(cx-view.x)*ns/view.s, cy-(cy-view.y)*ns/view.s, ns);
}
function zoomFit(){
  if(!S.nodes.length&&!S.zones.length) return;
  const all=[...S.nodes.map(n=>({x:n.x,y:n.y,r:n.big?34:27})),...S.zones.map(z=>({x:z.x+z.w/2,y:z.y+z.h/2,r:Math.max(z.w,z.h)/2}))];
  const minX=Math.min(...all.map(a=>a.x-a.r))-20;
  const maxX=Math.max(...all.map(a=>a.x+a.r))+20;
  const minY=Math.min(...all.map(a=>a.y-a.r))-20;
  const maxY=Math.max(...all.map(a=>a.y+a.r))+20;
  const cv=document.getElementById('canvas');
  const w=cv.clientWidth, h=cv.clientHeight;
  const s=Math.min(w/(maxX-minX),h/(maxY-minY),2)*0.9;
  setView(w/2-(minX+maxX)/2*s, h/2-(minY+maxY)/2*s, s);
}

function exportJSON(){

function exportSVG(){
  const cv=document.getElementById('canvas');
  const clone=cv.cloneNode(true);
  clone.removeAttribute('id'); clone.style='';
  // embed background color
  clone.setAttribute('style','background:#0d1117');
  const a=document.createElement('a');
  a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<?xml version="1.0" encoding="UTF-8"?>'+clone.outerHTML);
  a.download='topology.svg'; a.click();
}
function exportPNG(scale=4){
  // 1. compute world-space bounding box of all content
  const PAD=60;
  const xs=[], ys=[];
  S.nodes.forEach(n=>{ const r=n.size||27; xs.push(n.x-r,n.x+r); ys.push(n.y-r,n.y+r+r*0.8); });
  S.zones.forEach(z=>{ xs.push(z.x,z.x+z.w); ys.push(z.y,z.y+z.h); });
  if(xs.length===0){ toast('画布为空'); return; }
  const vx=Math.floor(Math.min(...xs)-PAD);
  const vy=Math.floor(Math.min(...ys)-PAD);
  const vw=Math.ceil(Math.max(...xs)-vx+PAD);
  const vh=Math.ceil(Math.max(...ys)-vy+PAD);

  // 2. clone SVG, reset world transform, set viewBox to content bounds
  const cv=document.getElementById('canvas');
  const clone=cv.cloneNode(true);
  clone.removeAttribute('id');
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  clone.setAttribute('viewBox',`${vx} ${vy} ${vw} ${vh}`);
  clone.setAttribute('width',vw); clone.setAttribute('height',vh);
  // reset pan/zoom transform so world coords are used directly
  clone.querySelector('#world')?.setAttribute('transform','translate(0,0) scale(1)');
  // remove UI overlays
  clone.querySelector('#_gbg')?.setAttribute('display','none');
  clone.querySelector('#_anch')?.remove();
  clone.querySelector('#_conn_preview')?.remove();
  // prepend background
  const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('x',vx); bg.setAttribute('y',vy);
  bg.setAttribute('width',vw); bg.setAttribute('height',vh);
  bg.setAttribute('fill','#0d1117');
  clone.insertBefore(bg,clone.firstChild);

  // 3. render to high-res canvas
  const svgStr='<?xml version="1.0" encoding="UTF-8"?>'+clone.outerHTML;
  const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const can=document.createElement('canvas');
    can.width=vw*scale; can.height=vh*scale;
    const ctx=can.getContext('2d');
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality='high';
    ctx.scale(scale,scale);
    ctx.drawImage(img,0,0,vw,vh);
    URL.revokeObjectURL(url);
    const ts=new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
    const a=document.createElement('a');
    a.href=can.toDataURL('image/png');
    a.download=`topology_${ts}_${scale}x.png`; a.click();
    toast(`PNG已导出 ${vw}×${vh}pt → ${vw*scale}×${vh*scale}px (${scale}x)`);
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast('PNG导出失败，请用SVG替代'); };
  img.src=url;
}
function importJSON(file){
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      snap();
      Object.assign(S,{nodes:d.nodes||[],edges:d.edges||[],zones:d.zones||[],sel:null});
      renderAll(); renderProps();
      toast(`已导入 ${S.nodes.length}节点 ${S.edges.length}连线`);
    }catch(err){ alert('无效JSON文件'); }
  };
  r.readAsText(file);
}

function buildSidebar(){
  const tools=[
    {tool:'select',icon:'mouse-pointer',label:'选择'},
    {tool:'connect',icon:'link',label:'连线'},
    {tool:'zone',icon:'square',label:'区域'},
    {tool:'pan',icon:'hand',label:'平移'},
  ];
  const tb=document.getElementById('tools');
  tools.forEach(({tool,icon,label})=>{
    const btn=document.createElement('button');
    btn.className='tool-btn'+(tool==='select'?' active':'');
    btn.dataset.tool=tool;
    btn.title=label;
    btn.appendChild(iconImg(icon,'#8b949e',15));
    const sp=document.createElement('span'); sp.textContent=label;
    btn.appendChild(sp);
    btn.addEventListener('click',()=>setTool(tool));
    tb.appendChild(btn);
  });

  const pal=document.getElementById('palette');
  CATALOG.forEach(({group,items})=>{
    const h=document.createElement('h3'); h.textContent=group; pal.appendChild(h);
    const grid=document.createElement('div'); grid.className='palette-grid';
    items.forEach(([label,icon,color])=>{
      const item=document.createElement('div');
      item.className='palette-item';
      item.draggable=true;
      item.title=label;
      item.appendChild(iconImg(icon,color,16));
      const sp=document.createElement('span'); sp.textContent=label; item.appendChild(sp);
      item.addEventListener('click',()=>{
        // toggle: clicking again cancels placement
        if(S.placeIcon && S.placeIcon.icon===icon && S.placeIcon.label===label){
          S.placeIcon=null;
          document.querySelectorAll('.palette-item').forEach(x=>x.style.outline='');
          setHint('就绪');
          return;
        }
        S.placeIcon={icon,label,color};
        // don't call setTool() — it would clear placeIcon
        document.querySelectorAll('.palette-item').forEach(x=>x.style.outline='');
        item.style.outline='1px solid #1f6feb';
        setHint(`点击画布放置「${label}」，Esc或再次点击取消`);
      });
      // drag to place
      item.addEventListener('dragstart',ev=>{
        ev.dataTransfer.setData('text/plain',JSON.stringify({icon,label,color}));
      });

    });

  });

      const wp=screenToWorld(e.clientX,e.clientY);
      snap();
      const n={id:uid('n'),x:wp.x,y:wp.y,...d,big:false};
      S.nodes.push(n); renderNode(n); select('node',n.id);
    }catch(_){}
  });
}

/* ============================================================
   KEYBOARD
   ============================================================ */
document.addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(e.ctrlKey||e.metaKey){
    if(e.key==='z'&&!e.shiftKey){ e.preventDefault(); undo(); }
    else if((e.key==='Z'&&e.shiftKey)||(e.key==='y')){ e.preventDefault(); redo(); }
    else if(e.key==='s'){ e.preventDefault(); saveLocal(); }
    else if(e.key==='a'){ e.preventDefault(); S.multiSel=new Set(S.nodes.map(n=>n.id)); S.sel=null; renderAll(); renderProps(); }
    else if(e.key==='c'){
      e.preventDefault();
      if(S.multiSel.size>0){
        const ids=S.multiSel;
        const nodes=[...ids].map(id=>JSON.parse(JSON.stringify(nodeById(id)))).filter(Boolean);
        const edges=S.edges.filter(e=>ids.has(e.src)&&ids.has(e.dst)).map(e=>JSON.parse(JSON.stringify(e)));
        clipboard={nodes,edges};
      } else if(S.sel?.type==='node'){
        clipboard={nodes:[JSON.parse(JSON.stringify(nodeById(S.sel.id)))],edges:[]};
      } else if(S.sel?.type==='zone'){
        clipboard={zones:[JSON.parse(JSON.stringify(zoneById(S.sel.id)))]};
      }
    }
    else if(e.key==='v'){
      e.preventDefault();
      if(!clipboard) return;
      snap();
      if(clipboard.nodes?.length>0){
        const idMap=new Map();
        const newNodes=clipboard.nodes.map(n=>{ const newId=uid('n'); idMap.set(n.id,newId); return {...n,id:newId,x:n.x+50,y:n.y+50}; });
        const newEdges=(clipboard.edges||[]).map(eg=>({...eg,id:uid('e'),src:idMap.get(eg.src),dst:idMap.get(eg.dst)}));
        S.nodes.push(...newNodes); S.edges.push(...newEdges);
        newNodes.forEach(renderNode); newEdges.forEach(renderEdge);
        S.sel=null; S.multiSel=new Set(newNodes.map(n=>n.id));
        if(newNodes.length===1){ S.sel={type:'node',id:newNodes[0].id}; S.multiSel.clear(); }
        renderAll(); renderProps();
      } else if(clipboard.zones?.length>0){
        const z={...clipboard.zones[0],id:uid('z'),x:clipboard.zones[0].x+50,y:clipboard.zones[0].y+50};
        S.zones.push(z); renderZone(z); select('zone',z.id);
      }
    }
    else if(e.key==='d'){ // duplicate shortcut
      e.preventDefault();
      if(S.multiSel.size>0){
        snap();
        const ids=S.multiSel;
        const nodes=[...ids].map(id=>JSON.parse(JSON.stringify(nodeById(id)))).filter(Boolean);
        const edges=S.edges.filter(e=>ids.has(e.src)&&ids.has(e.dst)).map(e=>JSON.parse(JSON.stringify(e)));
        const idMap=new Map();
        const newNodes=nodes.map(n=>{ const newId=uid('n'); idMap.set(n.id,newId); return {...n,id:newId,x:n.x+50,y:n.y+50}; });
        const newEdges=edges.map(eg=>({...eg,id:uid('e'),src:idMap.get(eg.src),dst:idMap.get(eg.dst)}));
        S.nodes.push(...newNodes); S.edges.push(...newEdges);
        newNodes.forEach(renderNode); newEdges.forEach(renderEdge);
        S.sel=null; S.multiSel=new Set(newNodes.map(n=>n.id));
        renderAll(); renderProps();
      } else if(S.sel?.type==='node'){
        snap();
        const src=nodeById(S.sel.id);
        const n={...JSON.parse(JSON.stringify(src)),id:uid('n'),x:src.x+50,y:src.y+50};
        S.nodes.push(n); renderNode(n); select('node',n.id);
      }
    }
    return;
  }
  if(e.key==='v'||e.key==='V') setTool('select');
  else if(e.key==='e'||e.key==='E') setTool('connect');
  else if(e.key==='z'||e.key==='Z') setTool('zone');
  else if(e.key===' '){ e.preventDefault(); setTool('pan'); }
  else if(e.key==='g'||e.key==='G'){ toggleGrid(); }
  else if(e.key==='Escape'){
    S._connSrc=null; S.placeIcon=null; S.multiSel.clear(); S.sel=null;
    document.querySelectorAll('.palette-item').forEach(x=>x.style.outline='');
    renderAll(); renderProps(); setHint('就绪');
  }
  else if((e.key==='['||e.key===']')&&S.sel?.type==='node'){
    e.preventDefault();
    layerOp('node',S.sel.id,e.key==='['?(e.shiftKey?'back':'backward'):(e.shiftKey?'front':'forward'));
    renderProps();
  }
  else if(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowRight'){
    const hasTarget=S.multiSel.size>0||(S.sel?.type==='node');
    if(!hasTarget) return;
    e.preventDefault();
    // snap before first keypress of a nudge sequence (debounced)
    if(!_nudgeTimer) snap();
    clearTimeout(_nudgeTimer);
    _nudgeTimer=setTimeout(()=>{ _nudgeTimer=null; },600);
    const step=e.shiftKey?1:(S.gridSnap?S.gridSize:4);
    const dx=e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0;
    const dy=e.key==='ArrowUp'?-step:e.key==='ArrowDown'?step:0;
    const ids=S.multiSel.size>0?[...S.multiSel]:[S.sel.id];
    ids.forEach(id=>{ const n=nodeById(id); if(n){n.x+=dx;n.y+=dy;} });
    renderAll();
  }
  else if(e.key==='Delete'||e.key==='Backspace'){
    if(S.multiSel.size>0){
      snap();
      S.nodes=S.nodes.filter(n=>!S.multiSel.has(n.id));
      S.edges=S.edges.filter(e=>!S.multiSel.has(e.src)&&!S.multiSel.has(e.dst));
      S.multiSel.clear(); S.sel=null; renderAll(); renderProps();
      return;
    }
    if(!S.sel) return;
    snap();
    if(S.sel.type==='node'){ S.nodes=S.nodes.filter(x=>x.id!==S.sel.id); S.edges=S.edges.filter(x=>x.src!==S.sel.id&&x.dst!==S.sel.id); }
    else if(S.sel.type==='edge') S.edges=S.edges.filter(x=>x.id!==S.sel.id);
    else if(S.sel.type==='zone') S.zones=S.zones.filter(x=>x.id!==S.sel.id);
    S.sel=null; renderAll(); renderProps();
  }
});

/* ============================================================
   UTILS
   ============================================================ */
function hexRgb(hex){
  hex=(hex||'#888888').replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16);
  return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}

if(!lsLoad()) loadInitial();
buildSidebar();
buildTopbar();
initGrid();
renderAll();
setTimeout(zoomFit,50);
setHint('就绪 · V选择 E连线 Z区域 空格平移 Del删除 Ctrl+Z撤销');
